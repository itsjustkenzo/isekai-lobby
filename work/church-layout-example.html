<div id="church-layout-example">
  <style>
    #church-layout-example { display:grid; gap:12px; }
    #church-layout-example .room { position:relative; display:grid; grid-template-columns:repeat(20,1fr); grid-template-rows:repeat(20,1fr); width:100%; max-width:540px; aspect-ratio:1; background:#b6ab92; background-image:linear-gradient(#5b534526 1px,transparent 1px),linear-gradient(90deg,#5b534526 1px,transparent 1px); background-size:5% 5%; color:#fff4da; image-rendering:pixelated; }
    #church-layout-example .wall { background:#2b2333; }
    #church-layout-example .west { grid-area:1/1/21/2; border-left:3px solid #514556; }
    #church-layout-example .east { grid-area:1/20/21/21; border-right:3px solid #514556; }
    #church-layout-example .south-left { grid-area:20/2/21/10; border-bottom:3px solid #514556; }
    #church-layout-example .south-right { grid-area:20/12/21/20; border-bottom:3px solid #514556; }
    #church-layout-example .north { grid-area:1/2/4/20; background:#e1d1ad; border-top:3px solid #514556; border-bottom:5px solid #665548; display:flex; align-items:center; justify-content:center; color:#46382c; }
    #church-layout-example .aisle { grid-area:8/10/20/12; background:#8f4140; border-left:2px solid #c39960; border-right:2px solid #c39960; }
    #church-layout-example .altar { grid-area:5/8/7/14; background:#77513a; border-top:5px solid #e3cca0; border-bottom:4px solid #4c3226; display:flex; align-items:center; justify-content:center; }
    #church-layout-example .pew { background:#835735; border-top:5px solid #bb8b54; border-bottom:4px solid #4d3025; }
    #church-layout-example .plant { background:#3c6a45; border:4px solid #8d5b38; }
    #church-layout-example .door { grid-area:20/10/21/12; background:repeating-linear-gradient(#91483f 0 5px,#61332f 5px 7px); border-left:3px solid #a77b47; border-right:3px solid #a77b47; }
    #church-layout-example .label { display:flex; align-items:center; justify-content:center; text-align:center; color:#40382d; }
    #church-layout-example .key { display:flex; flex-wrap:wrap; gap:8px 20px; }
    #church-layout-example .swatch { display:inline-block; width:12px; height:12px; margin-right:6px; }
